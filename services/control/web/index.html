<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070b14">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css?v=5">
  <title>Jarvis</title>
</head>
<body class="dashboard is-idle">
  <div class="wrap">
    <div class="top">
      <h1>Jarvis</h1>
      <a class="btn ghost" href="/avatar">Full screen</a>
    </div>

    <div class="card">
      <div class="visor" id="visor">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle class="halo" cx="100" cy="100" r="88"/>
          <circle class="ring" cx="100" cy="100" r="74"/>
          <circle class="ring-dash" cx="100" cy="100" r="60"/>
          <circle class="core-glow" cx="100" cy="100" r="30"/>
          <circle class="core" cx="100" cy="100" r="20"/>
          <rect class="eye" x="78" y="90" width="10" height="16" rx="3"/>
          <rect class="eye" x="112" y="90" width="10" height="16" rx="3"/>
          <path class="mouth" d="M86 118 Q100 130 114 118"/>
        </svg>
        <div class="visor-label" id="state">idle</div>
      </div>
    </div>

    <div class="card" id="pin-card" hidden>
      <div class="pin-row">
        <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
        <button id="unlock" type="button">Unlock</button>
      </div>
    </div>

    <div class="card">
      <div class="pills" id="pills"></div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:10px">Talk from this device — the room mic stays on</div>
      <button id="talk" class="talk" type="button">Tap to listen here</button>
      <div class="msg" id="talk-msg"></div>
      <div class="pin-row" style="margin-top:10px">
        <input id="say" type="text" placeholder="Or type a command" autocomplete="off"
               autocapitalize="sentences" enterkeyhint="send">
        <button id="send" type="button">Send</button>
      </div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:8px">Transcript</div>
      <div class="transcript" id="transcript">
        <div class="line muted">Nothing yet.</div>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button id="start" type="button">Start</button>
        <button id="stop" class="stop" type="button">Stop</button>
        <button id="clip" class="ghost" type="button">Clip 30s</button>
        <button id="snap" class="ghost" type="button">Take photo</button>
      </div>
      <div class="msg" id="msg"></div>
      <img class="preview" id="preview" alt="Latest snapshot">
      <div class="clips" id="clips"></div>
    </div>

    <div class="card">
      <div class="sub" style="margin-bottom:8px">Timing log</div>
      <div class="log" id="log">Waiting…</div>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const pills = $("pills");
    const msg = $("msg");
    const talkMsg = $("talk-msg");
    const preview = $("preview");
    const pinCard = $("pin-card");
    const transcriptEl = $("transcript");

    const entries = new Map();

    function setState(state) {
      const next = state || "idle";
      document.body.classList.remove("is-idle", "is-listening", "is-thinking", "is-speaking");
      document.body.classList.add("is-" + next);
      $("state").textContent = next;
    }

    function setBusy(on) {
      ["start", "stop", "snap", "clip"].forEach((id) => { $(id).disabled = on; });
    }

    function renderStatus(data) {
      if (data.state) setState(data.state);
      const items = [
        ["voice", data.voice],
        ["broker", data.broker],
        ["brain", data.services && data.services.brain],
        ["tts", data.services && data.services.tts],
        ["stt", data.services && data.services.stt],
        ["wake", data.services && data.services["mic-wakeword"]],
        ["clipper", data.services && data.services.clipper],
      ];
      pills.innerHTML = items.map(([name, on]) =>
        `<span class="pill ${on ? "on" : "off"}">${name}</span>`
      ).join("");
      if (data.latest_snap) {
        preview.src = data.latest_snap + "?t=" + Date.now();
        preview.classList.add("show");
      }
      pinCard.hidden = !data.pin_required;
      if (typeof data.mic_relay === "boolean") micRelay = data.mic_relay;
    }

    // ── transcript ────────────────────────────────────────────────
    const LABELS = { user: "You", jarvis: "Jarvis", system: "—" };

    function renderTranscript() {
      if (!entries.size) {
        transcriptEl.innerHTML = '<div class="line muted">Nothing yet.</div>';
        return;
      }
      const sorted = [...entries.values()].sort((a, b) => a.id - b.id);
      const nearBottom = transcriptEl.scrollHeight - transcriptEl.scrollTop
        - transcriptEl.clientHeight < 60;
      transcriptEl.innerHTML = sorted.map((e) => {
        const tag = e.role === "user" && e.source && e.source !== "voice"
          ? `${LABELS[e.role]} (${e.source})` : LABELS[e.role] || e.role;
        return `<div class="line ${e.role}"><span class="who">${tag}</span>${escapeHtml(e.text)}</div>`;
      }).join("");
      if (nearBottom) transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function upsert(entry) {
      entries.set(entry.id, entry);
      while (entries.size > 120) entries.delete(entries.keys().next().value);
      renderTranscript();
    }

    function replaceTranscript(list) {
      entries.clear();
      (list || []).forEach((e) => entries.set(e.id, e));
      renderTranscript();
    }

    function renderClips(list) {
      if (!list || !list.length) { $("clips").innerHTML = ""; return; }
      $("clips").innerHTML = list.map((c) =>
        `<a class="clip-row" href="${c.url}" target="_blank" rel="noopener">
           <span>${escapeHtml(c.name.replace(/^clip-/, ""))}</span>
           <span class="muted">${c.when} · ${c.size_mb} MB</span>
         </a>`).join("");
    }

    // ── api ───────────────────────────────────────────────────────
    async function api(path, opts) {
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        pinCard.hidden = false;
        throw new Error("PIN required");
      }
      if (!res.ok || data.ok === false) {
        throw new Error(data.detail || data.message || data.error || "request failed");
      }
      return data;
    }

    async function refresh() {
      const data = await fetch("/api/status").then((r) => r.json());
      renderStatus(data);
      try {
        const logs = await api("/api/logs");
        $("log").textContent = (logs.lines || []).join("\n") || "No log yet.";
        $("log").scrollTop = $("log").scrollHeight;
      } catch (_) {}
      try { renderClips((await api("/api/clips")).clips); } catch (_) {}
    }

    $("unlock").onclick = async () => {
      try {
        await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: $("pin").value }),
        });
        pinCard.hidden = true;
        msg.textContent = "Unlocked.";
        refresh();
      } catch (e) {
        msg.textContent = e.message;
      }
    };

    async function act(path, label, body) {
      setBusy(true);
      msg.textContent = label + "…";
      try {
        const opts = { method: "POST" };
        if (body) {
          opts.headers = { "Content-Type": "application/json" };
          opts.body = JSON.stringify(body);
        }
        const data = await api(path, opts);
        renderStatus(data);
        msg.textContent = data.message || (data.detail ? "Done." : "Done.");
        if (data.url) {
          preview.src = data.url + "?t=" + Date.now();
          preview.classList.add("show");
        }
        if (data.clips) renderClips(data.clips);
      } catch (e) {
        msg.textContent = e.message;
      } finally {
        setBusy(false);
        refresh();
      }
    }

    $("start").onclick = () => act("/api/start", "Starting");
    $("stop").onclick = () => act("/api/stop", "Stopping");
    $("snap").onclick = () => act("/api/snap", "Capturing");
    $("clip").onclick = () => act("/api/clip", "Clipping", { seconds: 30 });

    // ── typed commands ────────────────────────────────────────────
    async function sendTyped() {
      const text = $("say").value.trim();
      if (!text) return;
      $("send").disabled = true;
      try {
        await api("/api/say", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        $("say").value = "";
        talkMsg.textContent = "Sent.";
      } catch (e) {
        talkMsg.textContent = e.message;
      } finally {
        $("send").disabled = false;
      }
    }
    $("send").onclick = sendTyped;
    $("say").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); sendTyped(); }
    });

    // ── always-listen from this phone/laptop (room mic is separate) ──
    const talkBtn = $("talk");
    const canRecord = window.isSecureContext
      && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
      && typeof MediaRecorder !== "undefined";
    let micRelay = true;
    let listening = false;
    let capturing = false;
    let recorder = null;
    let micStream = null;
    let audioCtx = null;
    let vadTimer = null;
    let chunks = [];
    let sending = false;
    let speechStartedAt = 0;
    let lastLoudAt = 0;
    let heardSpeech = false;

    const httpsUrl = "https://" + location.host + "/";
    const localUrl = "http://127.0.0.1:" + (location.port || "8740") + "/";
    if (!window.isSecureContext
        && location.protocol === "http:"
        && location.hostname !== "localhost"
        && location.hostname !== "127.0.0.1") {
      location.replace("https://" + location.host + location.pathname + location.search);
    }

    if (!canRecord) {
      talkBtn.disabled = true;
      talkBtn.textContent = "Open via https";
      talkMsg.innerHTML = location.protocol === "https:"
        ? "This browser won't share the microphone."
        : "The mic only works on a secure page. Open "
          + `<a href="${httpsUrl}">${httpsUrl}</a> and accept the certificate warning once. `
          + `On this computer you can also use <a href="${localUrl}">${localUrl}</a>.`;
    }

    function pickMime() {
      const options = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"];
      for (const t of options) {
        if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }

    function rmsFromAnalyser(analyser) {
      const buf = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) {
        const v = (buf[i] - 128) / 128;
        sum += v * v;
      }
      return Math.sqrt(sum / buf.length);
    }

    function startCapture() {
      if (capturing || sending || !micStream) return;
      const mimeType = pickMime();
      chunks = [];
      recorder = new MediaRecorder(micStream, mimeType ? { mimeType } : undefined);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => { uploadUtterance(); };
      recorder.start();
      capturing = true;
      heardSpeech = true;
      speechStartedAt = Date.now();
      lastLoudAt = Date.now();
      talkBtn.classList.add("recording");
    }

    function stopCapture() {
      if (!capturing) return;
      capturing = false;
      talkBtn.classList.remove("recording");
      if (recorder && recorder.state !== "inactive") recorder.stop();
      else recorder = null;
    }

    async function uploadUtterance() {
      const type = (recorder && recorder.mimeType) || "audio/webm";
      const blob = new Blob(chunks, { type });
      recorder = null;
      const dur = Date.now() - speechStartedAt;
      if (blob.size < 1500 || dur < 350) return;
      sending = true;
      talkMsg.textContent = "Sending…";
      try {
        const data = await api("/api/voice", {
          method: "POST",
          headers: { "Content-Type": type },
          body: blob,
        });
        talkMsg.textContent = data.text ? `Heard: "${data.text}"` : (data.message || "Nothing heard.");
      } catch (e) {
        talkMsg.textContent = e.message;
      } finally {
        sending = false;
      }
    }

    function vadTick(analyser) {
      if (!listening) return;
      const level = rmsFromAnalyser(analyser);
      const now = Date.now();
      const SPEECH = 0.045;
      const SILENCE = 0.022;
      if (level >= SPEECH) {
        lastLoudAt = now;
        if (!capturing) startCapture();
        heardSpeech = true;
      }
      if (capturing) {
        if (now - speechStartedAt >= 12000) stopCapture();
        else if (heardSpeech && level < SILENCE && now - lastLoudAt >= 750) stopCapture();
      }
    }

    async function startAlwaysListen() {
      if (listening || !canRecord) return;
      if (!micRelay) {
        talkMsg.textContent = "No transcription key set on the Jarvis box.";
        return;
      }
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
            channelCount: 1,
          },
        });
      } catch (e) {
        talkMsg.textContent = "Microphone blocked. Allow access and tap again.";
        return;
      }
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      const src = audioCtx.createMediaStreamSource(micStream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      src.connect(analyser);
      listening = true;
      talkBtn.classList.add("listening");
      talkBtn.textContent = "Listening here — tap to pause";
      talkMsg.textContent = "Room mic is still on. Speak normally.";
      vadTimer = setInterval(() => vadTick(analyser), 50);
    }

    function stopAlwaysListen() {
      listening = false;
      clearInterval(vadTimer);
      vadTimer = null;
      stopCapture();
      talkBtn.classList.remove("listening", "recording");
      talkBtn.textContent = "Tap to listen here";
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; }
      if (micStream) { micStream.getTracks().forEach((t) => t.stop()); micStream = null; }
    }

    const onJarvisBox = location.hostname === "localhost" || location.hostname === "127.0.0.1";
    const LISTEN_KEY = "jarvis-listen-here";
    if (onJarvisBox && canRecord) {
      talkMsg.textContent = "Room mic is already always on. Use this on your phone.";
    }

    talkBtn.addEventListener("click", () => {
      if (!canRecord) return;
      if (listening) {
        try { localStorage.setItem(LISTEN_KEY, "0"); } catch (_) {}
        stopAlwaysListen();
      } else {
        try { localStorage.setItem(LISTEN_KEY, "1"); } catch (_) {}
        startAlwaysListen();
      }
    });
    talkBtn.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (capturing) stopCapture();
        return;
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    });

    async function maybeAutostart() {
      if (!canRecord || onJarvisBox) return;
      let want = true;
      try { want = localStorage.getItem(LISTEN_KEY) !== "0"; } catch (_) {}
      if (!want) return;
      let granted = false;
      try {
        const st = await navigator.permissions.query({ name: "microphone" });
        granted = st.state === "granted";
      } catch (_) {
        try { granted = localStorage.getItem(LISTEN_KEY) === "1"; } catch (__) {}
      }
      if (granted) startAlwaysListen();
    }
    maybeAutostart();

    // ── live feed ─────────────────────────────────────────────────
    const es = new EventSource("/api/events");
    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.state) setState(data.state);
        if (data.status) renderStatus(data.status);
        if (data.transcript_all) replaceTranscript(data.transcript_all);
        if (data.transcript) upsert(data.transcript);
        if (data.clips) renderClips(data.clips);
      } catch (_) {}
    };
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
