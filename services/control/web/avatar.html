<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#070b14">
  <link rel="stylesheet" href="/app.css?v=11">
  <title>Jarvis</title>
</head>
<body class="avatar-page is-idle">
  <a class="btn ghost back" href="/">Control</a>
  <div class="visor" id="visor">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle class="halo" cx="100" cy="100" r="88"/>
      <circle class="ring" cx="100" cy="100" r="74"/>
      <circle class="ring-dash" cx="100" cy="100" r="60"/>
      <g class="face-rig">
        <circle class="core-glow" cx="100" cy="100" r="48"/>
        <circle class="core" cx="100" cy="100" r="38"/>
        <path class="brow brow-l" d="M74 76 Q83 72 92 76"/>
        <path class="brow brow-r" d="M108 76 Q117 72 126 76"/>
        <rect class="eye eye-l" x="78" y="82" width="10" height="16" rx="3"/>
        <rect class="eye eye-r" x="112" y="82" width="10" height="16" rx="3"/>
        <path class="mouth" d="M86 110 Q100 116 114 110"/>
      </g>
    </svg>
    <img class="character" id="face" alt="">
    <div class="visor-label" id="label">idle</div>
  </div>
  <script src="/visor.js?v=2"></script>
  <script>
    const face = document.getElementById("face");
    const label = document.getElementById("label");
    const body = document.body;
    let idleSrc = "";
    let talkSrc = "";
    let hasCharacter = false;

    function setState(state) {
      const next = state || "idle";
      body.classList.remove("is-idle", "is-listening", "is-thinking", "is-speaking");
      body.classList.add("is-" + next);
      label.textContent = next;
      if (window.JarvisVisor) window.JarvisVisor.setState(next);
      if (hasCharacter) {
        face.src = next === "speaking" && talkSrc ? talkSrc : idleSrc;
      }
    }

    function tryCharacter() {
      const idle = new Image();
      idle.onload = () => {
        idleSrc = "/character/idle.png";
        hasCharacter = true;
        face.src = idleSrc;
        face.classList.add("show");
      };
      idle.src = "/character/idle.png";
      const talk = new Image();
      talk.onload = () => { talkSrc = "/character/talk.png"; };
      talk.src = "/character/talk.png";
    }

    const es = new EventSource("/api/events");
    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        if (data.state) setState(data.state);
      } catch (_) {}
    };
    tryCharacter();
  </script>
</body>
</html>
